version: "3.8"

services:
  # ==========================================
  # SERVIÇO PRINCIPAL (Backend + Frontend)
  # ==========================================
  zapvoice_app:
    image: aryalvesfernandes/zapvoice:backend-1.8.2
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public

    volumes:
      - zapvoice_uploads:/app/static/uploads
      - zapvoice_logs:/app/logs
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PORT=${PORT:-8000}
      - TZ=${TZ:-America/Sao_Paulo}
      - ENABLE_SCHEDULER=true # Apenas a API gerencia o agendamento
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - REGISTER_API_KEY=${REGISTER_API_KEY:-}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_EVENTS_PREFETCH_COUNT=${RABBITMQ_EVENTS_PREFETCH_COUNT:-100}
      - RABBITMQ_BULK_PREFETCH_COUNT=${RABBITMQ_BULK_PREFETCH_COUNT:-20}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-aryarajmarketing@gmail.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-123456}
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_WS_URL=${VITE_WS_URL:-}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - ENABLE_DOCS=${ENABLE_DOCS:-true}
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-30}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - COMPANY_NAME=${COMPANY_NAME:-zapvoice}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_MODEL=${OPENAI_API_MODEL:-gpt-5-mini}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-ZapVoice Funnels}
      - INSTAGRAM_VERIFY_TOKEN=${INSTAGRAM_VERIFY_TOKEN:-}
      - ENABLE_INSTAGRAM=${ENABLE_INSTAGRAM:-true}
      - CHAT_MESSAGES_WEBHOOK_URL=${CHAT_MESSAGES_WEBHOOK_URL:-}
      - WA_AUTO_REPLY_ENABLED=${WA_AUTO_REPLY_ENABLED:-false}
      - WA_AUTO_REPLY_MESSAGE=${WA_AUTO_REPLY_MESSAGE:-Este número é só para comunicados.}
      - WABA_CHECK_RETENTION_DAYS=${WABA_CHECK_RETENTION_DAYS:-30}
      - WEBHOOK_EVENT_RETENTION_DAYS=${WEBHOOK_EVENT_RETENTION_DAYS:-15}
      - MESSAGE_STATUS_RETENTION_DAYS=${MESSAGE_STATUS_RETENTION_DAYS:-90}
      - SIMULATE_MESSAGING=${SIMULATE_MESSAGING:-false}
      - SIMULATE_CHATWOOT_RATELIMIT=${SIMULATE_CHATWOOT_RATELIMIT:-false}
      # === MinIO (Storage Principal) ===
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://seu-minio.exemplo.com}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-sua-access-key}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-sua-secret-key}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-nome-do-bucket}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://seu-minio.exemplo.com}
      - S3_BACKUP_PREFIX=${S3_BACKUP_PREFIX:-backups/}
      # === Backblaze (Storage Fallback / Backup) ===
      - BACKBLAZE_S3_ENDPOINT_URL=${BACKBLAZE_S3_ENDPOINT_URL:-https://s3.us-west-004.backblazeb2.com}
      - BACKBLAZE_S3_ACCESS_KEY=${BACKBLAZE_S3_ACCESS_KEY:-sua-access-key-backblaze}
      - BACKBLAZE_S3_SECRET_KEY=${BACKBLAZE_S3_SECRET_KEY:-sua-secret-key-backblaze}
      - BACKBLAZE_S3_BUCKET_NAME=${BACKBLAZE_S3_BUCKET_NAME:-nome-do-bucket}
      - BACKBLAZE_S3_REGION=${BACKBLAZE_S3_REGION:-us-west-004}
      - BACKBLAZE_S3_PUBLIC_URL=${BACKBLAZE_S3_PUBLIC_URL:-https://seu-bucket.s3.us-west-004.backblazeb2.com}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.zapvoice.rule=Host(`${DOMAIN:-seu-dominio.com}`)
        - traefik.http.routers.zapvoice.entrypoints=websecure
        - traefik.http.routers.zapvoice.tls.certresolver=letsencryptresolver
        - traefik.http.services.zapvoice.loadbalancer.server.port=8000

  # ==========================================
  # SERVIÇO WORKER (Processamento em Segundo Plano)
  # ==========================================
  zapvoice_worker:
    image: aryalvesfernandes/zapvoice:worker-1.8.2
    command: python worker.py
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    volumes:
      - zapvoice_uploads:/app/static/uploads
      - zapvoice_logs:/app/logs
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - ENABLE_SCHEDULER=false # Worker nunca roda o agendamento
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - REGISTER_API_KEY=${REGISTER_API_KEY:-}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_EVENTS_PREFETCH_COUNT=${RABBITMQ_EVENTS_PREFETCH_COUNT:-100}
      - RABBITMQ_BULK_PREFETCH_COUNT=${RABBITMQ_BULK_PREFETCH_COUNT:-20}
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-30}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - COMPANY_NAME=${COMPANY_NAME:-zapvoice}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_MODEL=${OPENAI_API_MODEL:-gpt-5-mini}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-ZapVoice Funnels}
      - INSTAGRAM_VERIFY_TOKEN=${INSTAGRAM_VERIFY_TOKEN:-}
      - ENABLE_INSTAGRAM=${ENABLE_INSTAGRAM:-true}
      - CHAT_MESSAGES_WEBHOOK_URL=${CHAT_MESSAGES_WEBHOOK_URL:-}
      - WA_AUTO_REPLY_ENABLED=${WA_AUTO_REPLY_ENABLED:-false}
      - WA_AUTO_REPLY_MESSAGE=${WA_AUTO_REPLY_MESSAGE:-Este número é só para comunicados.}
      - WABA_CHECK_RETENTION_DAYS=${WABA_CHECK_RETENTION_DAYS:-30}
      - WEBHOOK_EVENT_RETENTION_DAYS=${WEBHOOK_EVENT_RETENTION_DAYS:-15}
      - MESSAGE_STATUS_RETENTION_DAYS=${MESSAGE_STATUS_RETENTION_DAYS:-90}
      - SIMULATE_MESSAGING=${SIMULATE_MESSAGING:-false}
      - SIMULATE_CHATWOOT_RATELIMIT=${SIMULATE_CHATWOOT_RATELIMIT:-false}
      # === MinIO (Storage Principal) ===
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://seu-minio.exemplo.com}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-sua-access-key}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-sua-secret-key}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-nome-do-bucket}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://seu-minio.exemplo.com}
      - S3_BACKUP_PREFIX=${S3_BACKUP_PREFIX:-backups/}
      # === Backblaze (Storage Fallback / Backup) ===
      - BACKBLAZE_S3_ENDPOINT_URL=${BACKBLAZE_S3_ENDPOINT_URL:-https://s3.us-west-004.backblazeb2.com}
      - BACKBLAZE_S3_ACCESS_KEY=${BACKBLAZE_S3_ACCESS_KEY:-sua-access-key-backblaze}
      - BACKBLAZE_S3_SECRET_KEY=${BACKBLAZE_S3_SECRET_KEY:-sua-secret-key-backblaze}
      - BACKBLAZE_S3_BUCKET_NAME=${BACKBLAZE_S3_BUCKET_NAME:-nome-do-bucket}
      - BACKBLAZE_S3_REGION=${BACKBLAZE_S3_REGION:-us-west-004}
      - BACKBLAZE_S3_PUBLIC_URL=${BACKBLAZE_S3_PUBLIC_URL:-https://seu-bucket.s3.us-west-004.backblazeb2.com}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

# ==========================================
# VOLUMES E REDES
# ==========================================
volumes:
  zapvoice_uploads:
    external: true
    name: zapvoice_uploads
  zapvoice_logs:
    name: zapvoice_logs

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true
