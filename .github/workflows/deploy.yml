name: CI/CD - Build, Push Docker Hub & Redeploy Portainer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_webhook:
        description: 'Alvo do Webhook do Portainer (ex: "all" para todos, ou "producao", "staging", etc.)'
        required: true
        default: 'all'
        type: string
      build_images:
        description: 'Construir e enviar imagens Docker para o Docker Hub?'
        required: true
        default: true
        type: boolean
      image_tag:
        description: 'Tag adicional da imagem Docker (ex: 1.8.2, latest)'
        required: false
        default: '1.8.2'
        type: string

jobs:
  # ==========================================
  # JOB 1: Testes Automatizados (CI)
  # ==========================================
  test:
    name: 🧪 Executar Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio respx pytest-mock httpx

      - name: 🧪 Rodar Testes do Backend & Scripts
        env:
          DATABASE_URL: 'sqlite://'
          SECRET_KEY: 'test-secret-key-for-github-actions-32-chars-long'
          SIMULATE_MESSAGING: 'false'
        run: |
          pytest scripts/tests/test_dispatch_portainer_webhooks.py -v
          pytest backend/tests_unit/test_auth.py backend/tests_unit/test_invitations.py backend/tests_unit/test_password_reset_link.py -v

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar Dependências do Frontend
        run: |
          cd frontend
          npm ci

      - name: 🧪 Rodar Testes do Frontend
        run: |
          cd frontend
          npx vitest run src/pages/ResetPassword/ResetPassword.test.jsx src/pages/InviteRegister/InviteRegister.test.jsx src/utils/__tests__/passwordGenerator.test.js

  # ==========================================
  # JOB 2: Build & Push Imagens Docker Hub
  # ==========================================
  build_and_push:
    name: 🐳 Build & Push Docker Hub
    needs: test
    if: |
      always() && 
      (needs.test.result == 'success') && 
      (github.event_name == 'push' || github.event.inputs.build_images == 'true' || github.event.inputs.build_images == true || github.event.inputs.build_images == null)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20 para Build do Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🏗️ Compilar Frontend (dist)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Definir Tags das Imagens
        id: tags
        run: |
          REPO="${{ secrets.DOCKERHUB_REPO }}"
          if [ -z "$REPO" ]; then
            REPO="aryalvesfernandes/zapvoice"
          fi
          
          CUSTOM_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$CUSTOM_TAG" ]; then
            CUSTOM_TAG="1.8.2"
          fi

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "api_tags=$REPO:backend-${{ github.sha }},$REPO:backend-latest,$REPO:backend-$CUSTOM_TAG" >> $GITHUB_OUTPUT
          echo "worker_tags=$REPO:worker-${{ github.sha }},$REPO:worker-latest,$REPO:worker-$CUSTOM_TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Build & Push Imagem Backend / API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Build & Push Imagem Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 3: Redeploy Automático no Portainer
  # ==========================================
  deploy_portainer:
    name: 🔄 Disparar Redeploy no Portainer
    needs: [build_and_push]
    if: |
      always() && 
      (needs.build_and_push.result == 'success' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_images == 'false' || github.event.inputs.build_images == false)))
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📡 Executar Disparo dos Webhooks do Portainer
        env:
          PORTAINER_WEBHOOKS: ${{ secrets.PORTAINER_WEBHOOKS }}
        run: |
          TARGET="${{ github.event.inputs.target_webhook }}"
          if [ -z "$TARGET" ]; then
            TARGET="all"
          fi
          python scripts/dispatch_portainer_webhooks.py --target "$TARGET"
