<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const savedBranding = localStorage.getItem('appBranding');
          if (savedBranding) {
            const branding = JSON.parse(savedBranding);
            if (branding && branding.name) {
              document.write('<title>' + branding.name + '</title>');
              return;
            }
          }
        } catch (e) {
          console.error(e);
        }
        document.write('<title>ZapVoice</title>');
      })();
    </script>
    <!-- Script de configuração dinâmica (Gerado no runtime pelo Docker) -->
    <script src="/env-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
