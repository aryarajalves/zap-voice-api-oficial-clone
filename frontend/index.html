<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const pathname = window.location.pathname;
          const hash = window.location.hash;
          
          if (pathname.startsWith('/c/')) {
            const slug = pathname.replace('/c/', '').split('/')[0].split('?')[0];
            const cachedTitle = sessionStorage.getItem('checkout_title_' + slug);
            document.write('<title>' + (cachedTitle || 'Aplicação Mentoria') + '</title>');
            return;
          }

          // Se for rota de captura pública (ex: /captulra ou /p/slug ou #/p/), não escrever título fixo ZapVoice
          const isReserved = ['/', '/login', '/dashboard', '/funnels', '/bulk', '/schedules', '/integrations', '/settings', '/users', '/logs', '/financial', '/checkout-presell', '/capture-page', '/blocked', '/hot-leads'].includes(pathname);
          const isPublicCapture = pathname.startsWith('/p/') || hash.startsWith('#/p/') || (!isReserved && pathname.length > 1);
          if (isPublicCapture) {
            document.write('<title>Carregando...</title>');
            return;
          }

          const savedBranding = localStorage.getItem('appBranding');
          if (savedBranding) {
            const branding = JSON.parse(savedBranding);
            if (branding && branding.name) {
              document.write('<title>' + branding.name + '</title>');
              return;
            }
          }
        } catch (e) {
          console.error(e);
        }
        document.write('<title>ZapVoice</title>');
      })();
    </script>
    <!-- Script de configuração dinâmica (Gerado no runtime pelo Docker) -->
    <script src="/env-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
